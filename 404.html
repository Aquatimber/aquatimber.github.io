<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#17211f"><title>云深不知处 · 云墨阁</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23315b5d'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='34' fill='%23f2eee4'%3E云%3C/text%3E%3C/svg%3E">
  <style>
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;place-items:center;overflow:hidden;color:#e3e2d8;background:#111b19;font-family:"STKaiti","KaiTi",serif}.mist{position:fixed;inset:-20%;background:radial-gradient(ellipse at 25% 45%,#315d5c 0,transparent 35%),radial-gradient(ellipse at 73% 55%,#694d6d 0,transparent 36%),radial-gradient(ellipse at 45% 88%,#88483f 0,transparent 24%);filter:blur(55px);opacity:.28;animation:drift 14s ease-in-out infinite alternate}.wrap{position:relative;z-index:1;width:min(90vw,720px);padding:60px 30px;text-align:center;border:1px solid rgba(210,218,206,.14);background:rgba(17,27,25,.45);backdrop-filter:blur(12px)}.num{margin:0;color:#81aaa5;font:400 clamp(6rem,25vw,13rem)/.8 Georgia,serif;letter-spacing:-.06em;text-shadow:0 0 35px rgba(87,173,166,.2)}h1{margin:28px 0 10px;font-weight:400;font-size:clamp(1.7rem,5vw,2.6rem);letter-spacing:.2em}p{margin:0 0 28px;color:#9aa9a3;letter-spacing:.08em}a{display:inline-flex;padding:10px 22px;border:1px solid #8e4e45;color:#ead9c0;background:rgba(130,60,51,.45);text-decoration:none;letter-spacing:.14em;transition:.3s}a:hover{box-shadow:0 0 24px rgba(75,177,170,.2);transform:translateY(-2px)}@keyframes drift{to{transform:translate(8%,-6%) scale(1.12)}}@media(prefers-reduced-motion:reduce){.mist{animation:none}}
  </style>
</head>
<body><div class="mist" aria-hidden="true"></div><main class="wrap"><p class="num">404</p><h1>云深不知处</h1><p>所寻之卷已随风移去，且回阁中再觅。</p><a id="home-link" href="/">返回云墨阁</a></main><script>const link=document.querySelector('#home-link');const parts=location.pathname.split('/').filter(Boolean);if(location.hostname.endsWith('.github.io')&&parts.length){const candidate=`/${parts[0]}/`;fetch(`${candidate}data/config.json`,{method:'HEAD'}).then(r=>{if(r.ok)link.href=candidate}).catch(()=>{})}</script></body>
</html>
